[pytest]
# Restricted to tests/ on purpose. The legacy test_risk_calculator.py and
# test_financial_profile.py at the backend root are print-style scripts
# with top-level execution, not pytest modules — collecting them would
# run them as a side effect of import.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
