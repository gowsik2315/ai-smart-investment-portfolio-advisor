[pytest]
# Restricted to tests/ on purpose. The legacy test_risk_calculator.py and
# test_financial_profile.py at the backend root are print-style scripts
# with top-level execution, not pytest modules — collecting them would
# run them as a side effect of import.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# No -q here: combined with a user-supplied -q it becomes -qq, which
# suppresses the pass/fail summary line entirely and makes a green run
# look like no run at all.
addopts = --strict-markers
filterwarnings =
    ignore::DeprecationWarning
